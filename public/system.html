<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#000000">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NDPi Monitor Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        * {
            font-size: 18px;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        input[type="file"]::file-selector-button {
            display: none;
        }
        html::selection {
            color: white;
            background: royalblue;
            text-shadow: 0.75px 0.5px 1.5px rgba(0, 0, 0, 0.8);
        }
        html,
        body {
            /* width: fit-content; */
            /* height: 100vh; */
            background: rgba(10, 13, 10, 1);
            font-family: "Montserrat", sans-serif;
            font-optical-sizing: auto;
            font-style: normal;
            color: #faf9f6;
        }
        .main {
            display: grid;
            padding: 0.5rem;
            gap: 0.5rem;
            grid-template-columns: repeat(auto-fit, minmax(clamp(400px, 600px, 100%), 1fr));
            justify-content: start;
            /* grid-auto-rows: 1fr; */
            /* grid-template-areas: 
            "box-1 box-2 box-2"
            "box-1 box-3 box-3"
            "box-4 box-4 box-4"
            "box-5 box-5 box-5"; */
        }
        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            padding: 0.8rem 1.0rem;
            background: rgba(25, 25, 25, 0.75);
            border-radius: 1.7rem;
            box-shadow: 0px 0px 5px -1px rgba(250, 250, 250, 0.6);
            overflow: scroll;
        }
        .flex-column {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            width: 100%;
            align-items: stretch;
        }
        .flex-row {
            display: flex;
            flex-direction: row;
            gap: 0.8rem;
            width: 100%;
            justify-content: center;
            align-items: center;
        }
        h2 {
            font-weight: 600;
            color: #eee;
            font-size: 1rem;
            width: 100%;
            /* margin-top: 6px; */
            /* margin-block-end: 8px; */
            -webkit-user-select: none;
            user-select: none;
        }
        label {
            font-weight: 400;
            color: #eee;
            font-size: 0.8rem;
            text-wrap-mode: nowrap;
        }
        select,
        input {
            font-weight: 400;
            width: 100%;
            padding-left: 0.5rem;
            padding-right: 0.5rem;
            background: rgba(255, 255, 255, 0.12);
            border: 1px inset rgba(255, 255, 255, 0.25);
            color: #eee;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            text-decoration: none;
            transition: box-shadow ease-in-out 200ms, border ease-in-out 200ms;
        }
        input::grammar-error {
            display: none;
        }
        select:focus,
        input:focus {
            box-shadow: 0px 0px 1px 2.5px rgba(0, 130, 200, 0.8);
            border-color: rgba(0, 130, 200, 0.8);
            border-style: solid;
        }
        input[type=file] {
            cursor: pointer;
            align-content: center;
        }
        select:disabled,
        input:disabled {
            border-color: #777;
            border-style: solid;
            background: rgba(255, 255, 255, 0.05);;
            color: #999;
            text-shadow: none;
            cursor: not-allowed;

        }
        button {
            background: rgba(129, 193, 39, 1);
            border-color: rgba(103, 167, 14, 1);
            border-style: solid;
            border-width: 1px 2px 1px 4px;
            color: #faf9f6;
            text-shadow: 1px 1px 20px rgba(0, 0, 0, 0.9), 0.75px 0.75px 1px rgba(25, 25, 25, 1);
            padding: 0.3rem 1.3rem;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
            text-wrap-mode: nowrap;
            transition: all ease-in-out 150ms;
        }
        button:hover {
            background: rgba(103, 167, 14, 1);
            border-color: rgba(129, 193, 39, 1);
            box-shadow: 0px 0px 5px rgba(200, 200, 200, 0.2);
        }
        button:active {
            background: rgba(129, 193, 39, 1);
            border-color: rgba(103, 167, 14, 1);
        }
        button:disabled:hover,
        button:disabled {
            border-color: #777;
            background: #555;
            color: #999;
            text-shadow: none;
            box-shadow: none;
            cursor: not-allowed;
        }
        .red {
            min-width: 0;
            color: #faf9f6;
            background: rgba(220, 40, 40, 1);
            border-color: rgba(190, 10, 10, 1);
        }
        .red:hover {
            background: rgba(190, 10, 10, 1);
            border-color: rgba(220, 40, 40, 1);
        }
        .red:active {
            background: rgba(220, 40, 40, 1);
            border-color: rgba(190, 10, 10, 1);
        }
        .yellow {
            min-width: 0;
            color: #faf9f6;
            background: rgba(240, 210, 0, 1);
            border-color: rgba(200, 170, 0, 1);
        }
        .yellow:hover {
            background: rgba(200, 170, 0, 1);
            border-color: rgba(240, 210, 0, 1);
        }
        .yellow:active {
            background: rgba(240, 210, 0, 1);
            border-color: rgba(200, 170, 0, 1);
        }

        button,
        input,
        select {
            height: 2rem;
            min-height: 2rem;
            border-radius: 0.8rem;
        }

        .div-label {
            text-transform: uppercase;
            text-align: left;
            padding-left: 0.5rem;
            margin-bottom: 0.5rem;
            font-size: 0.8rem;
            font-weight: 600;
            -webkit-user-select: none;
            user-select: none;
        }

        #overlay_preview img {
            max-height: 108px;
            max-width: 192px;
        }
        svg {
            stroke-width: 0.75px;
            stroke: rgba(0, 0, 0, 0.8);
            paint-order: stroke;
            stroke-linejoin: round;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="card">
            <h2>Connected TV Controls</h2>
            <div class="flex-row">
                <div class="flex-column">
                    <button id="tv_power_on">
                        <span>ON</span>
                        <svg xmlns="http://www.w3.org/2000/svg" height="30" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M7.5 1v7h1V1z"/>
                            <path d="M3 8.812a5 5 0 0 1 2.578-4.375l-.485-.874A6 6 0 1 0 11 3.616l-.501.865A5 5 0 1 1 3 8.812"/>
                        </svg>
                    </button>
                    <button class="red" id="tv_power_off">
                        <span>OFF</span>
                        <svg xmlns="http://www.w3.org/2000/svg" height="30" fill="currentColor" style="stroke-width: 0.75px; stroke: rgba(20, 20, 20, 0.7); paint-order: stroke; stroke-linejoin: round;" viewBox="0 0 16 16">
                            <path d="M7.5 1v7h1V1z"/>
                            <path d="M3 8.812a5 5 0 0 1 2.578-4.375l-.485-.874A6 6 0 1 0 11 3.616l-.501.865A5 5 0 1 1 3 8.812"/>
                        </svg>
                    </button>
                </div>
                <div class="flex-column">
                    <button id="tv_as">
                        <span>NDPi Monitor</span>
                    </button>
                    <button class="red" id="tv_is">
                        <span>Home</span>
                    </button>
                </div>
                <div class="flex-column">
                    <button id="tv_volume_up">
                        <svg xmlns="http://www.w3.org/2000/svg" height="30" fill="currentColor" style="stroke-width: 0.75px; stroke: rgba(20, 100, 20, 1); paint-order: stroke; stroke-linejoin: round;" viewBox="0 0 16 16">
                            <path d="M11.536 14.01A8.47 8.47 0 0 0 14.026 8a8.47 8.47 0 0 0-2.49-6.01l-.708.707A7.48 7.48 0 0 1 13.025 8c0 2.071-.84 3.946-2.197 5.303z"/>
                            <path d="M10.121 12.596A6.48 6.48 0 0 0 12.025 8a6.48 6.48 0 0 0-1.904-4.596l-.707.707A5.48 5.48 0 0 1 11.025 8a5.48 5.48 0 0 1-1.61 3.89z"/>
                            <path d="M8.707 11.182A4.5 4.5 0 0 0 10.025 8a4.5 4.5 0 0 0-1.318-3.182L8 5.525A3.5 3.5 0 0 1 9.025 8 3.5 3.5 0 0 1 8 10.475zM6.717 3.55A.5.5 0 0 1 7 4v8a.5.5 0 0 1-.812.39L3.825 10.5H1.5A.5.5 0 0 1 1 10V6a.5.5 0 0 1 .5-.5h2.325l2.363-1.89a.5.5 0 0 1 .529-.06"/>
                        </svg>
                    </button>
                    <button id="tv_volume_down">
                        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" style="stroke-width: 0.75px; stroke: rgba(20, 100, 20, 1); paint-order: stroke; stroke-linejoin: round;" viewBox="0 0 16 16">
                            <path d="M9 4a.5.5 0 0 0-.812-.39L5.825 5.5H3.5A.5.5 0 0 0 3 6v4a.5.5 0 0 0 .5.5h2.325l2.363 1.89A.5.5 0 0 0 9 12zm3.025 4a4.5 4.5 0 0 1-1.318 3.182L10 10.475A3.5 3.5 0 0 0 11.025 8 3.5 3.5 0 0 0 10 5.525l.707-.707A4.5 4.5 0 0 1 12.025 8"/>
                        </svg>
                    </button>
                </div>
            </div>
            <label>Custom CEC Command</label>
            <input type="text" value="" id="send_bytes">
        </div>
        <div class="card">
            <h2>NDI Source</h2>
            <div class="flex-column">
                <select id="source_selection">
                    <option value="none">None</option>
                </select>
                <button style="min-width: 0;" id="refresh_sources">Refresh</button>
            </div>
        </div>
        <div class="card">
            <h2>Overlay Image</h2>
            <div class="flex-row">
                <input id="overlay_upload" type="file" accept=".jpg, .png, .svg" title="Upload Image"/>
                <button id="save_overlay" disabled>Set Overlay</button>
                <button class="red" id="reset_overlay_upload">Reset</button>
            </div>
            <div class="flex-row">
                <div id="overlay_preview"></div>
            </div>
        </div>
        <div class="card">
            <div class="flex-column">
                <button class="yellow" id="device_reboot">REBOOT Device</button>
                <button class="red" id="device_shutdown">SHUTDOWN Device</button>
            </div>
        </div>
        <div class="card">
            <h2>System Settings</h2>
            <div class="flex-column" id="settings"></div>
        </div>
    </div>
</body>

<script src="/socket.js"></script>
<script>
    (async () => {
        await refreshSources();
        addEvents();
    })();
    
    // import NDPi_WebSocket from './socket.js'
    const server = new NDPi_WebSocket('ws/system');

    server._ws.onmessage = (message) => {
        try
        {
            const msg = JSON.parse(message.data);
            for (const [id, object] of msg)
            {
                const settingInnerHTML = `
                    <div class="div-label">${String(id.split('_').join(' '))}</div>
                    <input type="text" id="${id}" value="${String(object.value).replaceAll('"', "'")}" ${object.allowEditExternal ? '' : 'disabled'}>
                `;

                if (id === 'ndpi_status_ndi_source_target') 
                { document.getElementById('source_selection').value = object.value || 'none'; }

                let settingEl = document.getElementById(`__${id}`);
                if (!settingEl)
                {
                    settingEl = document.createElement('div');
                    settingEl.id = `__${id}`;
                    settingEl.innerHTML = settingInnerHTML;
                    document.getElementById('settings').appendChild(settingEl);
                } else
                {
                    settingEl.innerHTML = settingInnerHTML;
                }
            }
        }
        catch (e)
        { console.error('Invalid message:', e); }
    };

    // Available sources array.
    let availableSources = [];
    const uploaderEl = document.getElementById('overlay_upload');
    const uploaderPreviewEl = document.getElementById('overlay_preview');
    let overlayUploadCommand = {
        type: 'set-overlay',
        data: {
            name: '',
            type: '',
            size: 0,
            dateLastModified: '',
            dateUploaded: '',
            src: '',
        }
    };

    function addEvents() {
        document.getElementById('tv_power_off').addEventListener('click', async (e) => {
            e.preventDefault();
            await sendCommand({
                type: 'send-cec',
                // data: 'standby%200',
                data: encodeURI('standby 0'),
            });
        });
        document.getElementById('tv_power_on').addEventListener('click', async (e) => {
            e.preventDefault();
            await sendCommand({
                type: 'send-cec',
                data: encodeURI('on 0'),
            });
        });
        document.getElementById('tv_volume_down').addEventListener('click', async (e) => {
            e.preventDefault();
            await sendCommand({
                type: 'send-cec',
                data: encodeURI('voldown'),
            });
        });
        document.getElementById('tv_volume_up').addEventListener('click', async (e) => {
            e.preventDefault();
            await sendCommand({
                type: 'send-cec',
                data: encodeURI('volup'),
            });
        });
        document.getElementById('tv_as').addEventListener('click', async (e) => {
            e.preventDefault();
            await sendCommand({
                type: 'send-cec',
                data: encodeURI('as'),
            });
        });
        document.getElementById('tv_is').addEventListener('click', async (e) => {
            e.preventDefault();
            await sendCommand({
                type: 'send-cec',
                data: encodeURI('is'),
            });
        });
        document.getElementById('send_bytes').addEventListener('change', async function(e) {
            e.preventDefault();
            this.disabled = true;
            await sendCommand({
                type: 'send-cec',
                data: encodeURI(`${this.value}`),
            });
            this.value = '';
            this.disabled = false;
        });
        document.getElementById('source_selection').addEventListener('change', async function(e) {
            e.preventDefault();
            this.disabled = true;
            await sendCommand({
                type: 'set-source',
                data: this.value,
            });
            this.disabled = false;
        });
        document.getElementById('refresh_sources').addEventListener('click', async function(e) {
            e.preventDefault();
            this.disabled = true;
            await refreshSources();
            this.disabled = false;
        });
        uploaderEl.addEventListener('change', handleFiles);
        document.getElementById('reset_overlay_upload').addEventListener('click', (e) => {
            e.preventDefault();
            resetOverlayUpload();
        });
        document.getElementById('save_overlay').addEventListener('click', async function(e) {
            e.preventDefault();
            this.disabled = true;
            const res = await sendCommand(overlayUploadCommand);
            if (res?.success)
            { resetOverlayUpload(); }
            else
            { console.error('Failed to upload overlay.', res) }
        });
        document.getElementById('device_reboot').addEventListener('click', async function(e) {
            e.preventDefault();
            this.disabled = true;
            this.textContent = 'REBOOTING...'
            await sendCommand({
                type: 'reboot-device'
            });
        });
        document.getElementById('device_shutdown').addEventListener('click', async function(e) {
            e.preventDefault();
            this.disabled = true;
            this.textContent = 'SHUTTING DOWN...'
            await sendCommand({
                type: 'shutdown-device'
            });
        });
        
    }

    function resetOverlayUpload() {
        document.getElementById('save_overlay').disabled = true;
        uploaderEl.value = '';
        uploaderPreviewEl.innerHTML = '';
        overlayUploadCommand = {
            type: 'set-overlay',
            data: {
                name: '',
                type: '',
                size: 0,
                dateLastModified: '',
                dateUploaded: '',
                src: '',
            }
        };
    }

    async function handleFiles() {
        uploaderEl.scroll({behavior: 'smooth'});
        const file = uploaderEl.files[0];

        if (!file.type.startsWith("image/"))
        { return; }

        const img = document.createElement("img");
        img.file = file;
        uploaderPreviewEl.appendChild(img);

        overlayUploadCommand.data.name = file.name || '';
        overlayUploadCommand.data.type = file.type || '';
        overlayUploadCommand.data.size = file.size || 0;
        overlayUploadCommand.data.dateLastModified = file.lastModified;
        overlayUploadCommand.data.dateUploaded = Date.now();


        const reader = new FileReader();
        reader.onload = (e) => {
            img.src = e.target.result;
            overlayUploadCommand.data.src = e.target.result;
            if (overlayUploadCommand.data.src)
            { document.getElementById('save_overlay').disabled = false; }
        };
        reader.readAsDataURL(file);
    }

    async function sendCommand(command = {}, viaWebSocket = true) {
        if (!command.type) return null;
        
        if (viaWebSocket && server?._ws && server?._ws.readyState === WebSocket.OPEN) 
        {
            try
            {
                server._ws.send(JSON.stringify(command));
                return;
            }
            catch (err)
            { console.error(err); }
        }
        
        // const searchParams = new URLSearchParams(command).toString();
        // const url = new URLPattern(window.location.href);
        // const urlString = `${url.protocol}://${url.hostname}:${url.port}/api/v1/command?${searchParams}`;

        const url = new URLPattern(window.location.href);
        const urlString = `${url.protocol}://${url.hostname}:${url.port}/api/v1/command`;

        let data = null;
        try
        {
            const res = await fetch(urlString, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(command)
            });
            if (!res.ok) throw new Error(await res.json());
            data = await res.json();
        }
        catch (e) 
        { console.error(e); }
        return data;
    }
   
    async function refreshSources() {
        const response = await sendCommand({ type: 'get-sources' }, false);
        console.log(response);
        if (response?.success)
        { availableSources = response.data.sources || []; }
        renderSources();
    }
    
    function renderSources() {
        const sourceSelectorEl = document.getElementById('source_selection');
        if (!sourceSelectorEl)
        { return; }

        sourceSelectorEl.innerHTML = '';

        const noSourceOpt = document.createElement('option');
        noSourceOpt.value = 'none';
        noSourceOpt.textContent = 'Clear Source';
        sourceSelectorEl.appendChild(noSourceOpt);

        if (availableSources.length >= 1)
        {
            availableSources.forEach((source) => {
                if (!source.name)
                { return; }

                const sourceOpt = document.createElement('option');
                sourceOpt.value = source.name;
                sourceOpt.dataset.url = source.url || '';
                sourceOpt.textContent = source.name;
                sourceSelectorEl.appendChild(sourceOpt);
            });
        }
        const currentSourceEl = document.getElementById('ndpi_status_ndi_source_target');

        if (currentSourceEl)
        { sourceSelectorEl.value = currentSourceEl.value || 'none'; }
    }
</script>

</html>
