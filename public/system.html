<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#000000">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NDPi Monitor | System Config</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        input[type="file"]::file-selector-button {
            display: none;
        }
        html::-webkit-scrollbar {
            display: none;
        }
        html::selection {
            color: white;
            background: royalblue;
            text-shadow: 0.75px 0.5px 1.5px rgba(0, 0, 0, 0.8);
        }
        html,
        body {
            background: rgba(10, 13, 10, 1);
            font-family: "Montserrat", sans-serif;
            font-optical-sizing: auto;
            font-style: normal;
            font-size: 18px;
            color: #f8f7f4;
        }
        .main {
            display: grid;
            padding: 0.5rem;
            gap: 0.8rem;
            grid-template-columns: repeat(auto-fit, minmax(clamp(400px, 600px, 100%), 1fr));
            justify-content: start;
            /* grid-auto-rows: 1fr; */
            /* grid-template-areas: 
            "box-1 box-2 box-2"
            "box-1 box-3 box-3"
            "box-4 box-4 box-4"
            "box-5 box-5 box-5"; */
        }
        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            padding: 0.8rem 1.0rem;
            background: rgba(25, 25, 25, 0.75);
            border-radius: 1.4rem;
            box-shadow: 0px 0px 5px -1px rgba(250, 250, 250, 0.6);
            overflow: auto;
        }
        .flex-column {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            width: 100%;
            align-items: stretch;
        }
        .flex-row {
            display: flex;
            flex-direction: row;
            gap: 0.8rem;
            width: 100%;
            justify-content: center;
            align-items: center;
        }
        h2 {
            font-weight: 600;
            color: #f8f7f4;
            font-size: 1rem;
            width: 100%;
            text-transform: uppercase;
            -webkit-user-select: none;
            user-select: none;
        }
        textarea,
        select,
        input {
            font-weight: 400;
            width: 100%;
            padding-left: 0.5rem;
            padding-right: 0.5rem;
            background: rgba(255, 255, 255, 0.12);
            border: 1px inset rgba(255, 255, 255, 0.25);
            color: #eee;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            text-decoration: none;
            transition: box-shadow ease-in-out 200ms, border ease-in-out 200ms;
        }
        textarea:focus,
        select:focus,
        input:focus {
            box-shadow: 0px 0px 1px 2.5px rgba(0, 130, 200, 0.8);
            border-color: rgba(0, 130, 200, 0.8);
            border-style: solid;
        }
        textarea:disabled,
        select:disabled,
        input:disabled {
            border-color: #777;
            border-style: solid;
            background: rgba(255, 255, 255, 0.05);;
            color: #999;
            text-shadow: none;
            cursor: not-allowed;

        }
        textarea::spelling-error,
        textarea::grammar-error,
        input::spelling-error,
        input::grammar-error {
            display: none;
        }

        input[type=file] {
            cursor: pointer;
            align-content: center;
        }

        button {
            background: rgba(129, 193, 39, 1);
            border-color: rgba(103, 167, 14, 1);
            border-style: solid;
            border-width: 1px 2px 1px 4px;
            color: #f8f7f4;
            text-shadow: 1px 1px 20px rgba(0, 0, 0, 0.9), 0.75px 0.75px 1px rgba(25, 25, 25, 1);
            padding: 0.3rem 1.3rem;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
            text-wrap-mode: nowrap;
            transition: all ease-in-out 150ms;
        }
        button:hover {
            background: rgba(103, 167, 14, 1);
            border-color: rgba(129, 193, 39, 1);
            box-shadow: 0px 0px 5px rgba(200, 200, 200, 0.2);
        }
        button:active {
            background: rgba(129, 193, 39, 1);
            border-color: rgba(103, 167, 14, 1);
        }
        button:disabled:hover,
        button:disabled {
            border-color: #777;
            background: #555;
            color: #999;
            text-shadow: none;
            box-shadow: none;
            cursor: not-allowed;
        }
        .red {
            min-width: 0;
            color: #f8f7f4;
            background: rgba(220, 40, 40, 1);
            border-color: rgba(190, 10, 10, 1);
        }
        .red:hover {
            background: rgba(190, 10, 10, 1);
            border-color: rgba(220, 40, 40, 1);
        }
        .red:active {
            background: rgba(220, 40, 40, 1);
            border-color: rgba(190, 10, 10, 1);
        }
        .yellow {
            min-width: 0;
            color: #f8f7f4;
            background: rgba(240, 210, 0, 1);
            border-color: rgba(200, 170, 0, 1);
        }
        .yellow:hover {
            background: rgba(200, 170, 0, 1);
            border-color: rgba(240, 210, 0, 1);
        }
        .yellow:active {
            background: rgba(240, 210, 0, 1);
            border-color: rgba(200, 170, 0, 1);
        }

        textarea,
        button,
        input,
        select {
            height: 1.75rem;
            min-height: 1.75rem;
            border-radius: 0.55rem;
        }

        .div-label {
            text-transform: uppercase;
            text-align: left;
            padding-left: 0.5rem;
            margin-bottom: 0.25rem;
            font-size: 0.8rem;
            font-weight: 600;
            -webkit-user-select: none;
            user-select: none;
        }

        #overlay_preview img {
            height: auto;
            width: auto;
            border-radius: 0.55rem;
            transition: all 500ms ease-in-out;
            /* max-height: 108px; */
            max-width: 100%;
        }
        svg {
            stroke-width: 0.75px;
            stroke: rgba(0, 0, 0, 0.8);
            paint-order: stroke;
            stroke-linejoin: round;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="card">
            <h2>Connected TV Controls</h2>
            <div class="flex-row">
                <div class="flex-column">
                    <button id="tv_power_on">
                        ON
                        <svg xmlns="http://www.w3.org/2000/svg" height="30" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M7.5 1v7h1V1z"/>
                            <path d="M3 8.812a5 5 0 0 1 2.578-4.375l-.485-.874A6 6 0 1 0 11 3.616l-.501.865A5 5 0 1 1 3 8.812"/>
                        </svg>
                    </button>
                    <button class="red" id="tv_power_off">
                        OFF
                        <svg xmlns="http://www.w3.org/2000/svg" height="30" fill="currentColor" style="stroke-width: 0.75px; stroke: rgba(20, 20, 20, 0.7); paint-order: stroke; stroke-linejoin: round;" viewBox="0 0 16 16">
                            <path d="M7.5 1v7h1V1z"/>
                            <path d="M3 8.812a5 5 0 0 1 2.578-4.375l-.485-.874A6 6 0 1 0 11 3.616l-.501.865A5 5 0 1 1 3 8.812"/>
                        </svg>
                    </button>
                </div>
                <div class="flex-column">
                    <button id="tv_as">
                        NDPi Monitor
                    </button>
                    <button class="red" id="tv_is">
                        TV Home
                    </button>
                </div>
                <div class="flex-column">
                    <button id="tv_volume_up">
                        <svg xmlns="http://www.w3.org/2000/svg" height="30" fill="currentColor" style="stroke-width: 0.75px; stroke: rgba(20, 100, 20, 1); paint-order: stroke; stroke-linejoin: round;" viewBox="0 0 16 16">
                            <path d="M11.536 14.01A8.47 8.47 0 0 0 14.026 8a8.47 8.47 0 0 0-2.49-6.01l-.708.707A7.48 7.48 0 0 1 13.025 8c0 2.071-.84 3.946-2.197 5.303z"/>
                            <path d="M10.121 12.596A6.48 6.48 0 0 0 12.025 8a6.48 6.48 0 0 0-1.904-4.596l-.707.707A5.48 5.48 0 0 1 11.025 8a5.48 5.48 0 0 1-1.61 3.89z"/>
                            <path d="M8.707 11.182A4.5 4.5 0 0 0 10.025 8a4.5 4.5 0 0 0-1.318-3.182L8 5.525A3.5 3.5 0 0 1 9.025 8 3.5 3.5 0 0 1 8 10.475zM6.717 3.55A.5.5 0 0 1 7 4v8a.5.5 0 0 1-.812.39L3.825 10.5H1.5A.5.5 0 0 1 1 10V6a.5.5 0 0 1 .5-.5h2.325l2.363-1.89a.5.5 0 0 1 .529-.06"/>
                        </svg>
                    </button>
                    <button id="tv_volume_down">
                        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" style="stroke-width: 0.75px; stroke: rgba(20, 100, 20, 1); paint-order: stroke; stroke-linejoin: round;" viewBox="0 0 16 16">
                            <path d="M9 4a.5.5 0 0 0-.812-.39L5.825 5.5H3.5A.5.5 0 0 0 3 6v4a.5.5 0 0 0 .5.5h2.325l2.363 1.89A.5.5 0 0 0 9 12zm3.025 4a4.5 4.5 0 0 1-1.318 3.182L10 10.475A3.5 3.5 0 0 0 11.025 8 3.5 3.5 0 0 0 10 5.525l.707-.707A4.5 4.5 0 0 1 12.025 8"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div style="width: 100%;">
                <div class="div-label">Custom CEC Command</div>
                <input type="text" value="" id="send_bytes">
            </div>
        </div>
        <div class="card">
            <h2>NDI Source</h2>
            <div class="flex-column">
                <select id="source_selection">
                    <option value="none">None</option>
                </select>
                <button style="min-width: 0;" id="refresh_sources">Refresh</button>
            </div>
        </div>
        <div class="card">
            <h2>Overlay Image</h2>
            <div class="flex-row">
                <input id="overlay_upload" type="file" accept=".jpg, .png, .svg" title="Upload Image"/>
                <button id="save_overlay" disabled>Set Overlay</button>
                <button class="red" id="reset_overlay_upload">Reset</button>
            </div>
            <div class="flex-row">
                <div id="overlay_preview">
                    <img id="media_overlay_image">
                </div>
            </div>
        </div>
        <div class="card">
            <div class="flex-column">
                <button id="device_update" disabled>UPDATE Device</button>
                <button class="yellow" id="device_reboot">REBOOT Device</button>
                <button class="red" id="device_shutdown">SHUTDOWN Device</button>
            </div>
        </div>
        <div class="card">
            <h2>System Settings</h2>
            <div class="flex-column" id="settings"></div>
        </div>
    </div>
</body>

<script src="/socket.js"></script>
<script src="/system.js"></script>

</html>
