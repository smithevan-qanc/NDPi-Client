<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#000000">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NDPi Monitor Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100vw;
            height: 100vh;
            background: rgba(50, 50, 50, 1);
        }
        label {
            font-weight: 600;
            color: #eee;
            font-size: 16px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin-block-end: 6px;
        }
        input {
            font-family: 'Courier New', Courier, monospace;
            width: 100%;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #eee;
            font-size: 16px;
            letter-spacing: 0.5px;
            box-sizing: border-box;
            outline: none;
        }
        button {
            background: rgba(129, 193, 39, 0.9);
            border: none;
            border-radius: 8px;
            color: white;
            padding: 10px 16px;
            font-size: 16px;
            cursor: pointer;
            min-width: 200px;
        }
        button:hover {
            background: rgba(129, 193, 39, 0.8);
        }
        .main {
            /* height: 100vh;
            width: 100vw; */
            display: grid;
            margin: 10px;
        }
        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .flex-column {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 10px;
            width: 100%;
        }
        .flex-row {
            display: flex;
            flex-direction: row;
            gap: 10px;
            margin-bottom: 10px;
            width: 100%;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="card">
            <label>Connected TV Controls</label>
            <div class="flex-row">
                <button id="tv_power_off">Off</button>
                <button id="tv_power_on">On</button>
            </div>
            <label>Volume</label>
            <div class="flex-row">
                <button id="tv_volume_down">-</button>
                <button id="tv_volume_up">+</button>
            </div>
            <label>Input</label>
            <div class="flex-column">
                <button id="tv_as">Switch To NDPi</button>
                <button id="tv_is">Home</button>
            </div>
            <label>Custom CEC Command</label>
            <input type="text" value="" id="send_bytes">
        </div>
        <div class="card">
            <label>NDI Source</label>
            <div class="flex-row">
                <select id="source_selection"></select>
            </div>
        </div>
        <div class="card" id="settings"></div>
    </div>
</body>

<script src="/system.js"></script>
<script>
    (() => {
        document.getElementById('tv_power_off').addEventListener('click', async (e) => {
            e.preventDefault();
            await sendCommand({
                type: 'send-cec',
                data: 'standby%200',
            });
        });
        document.getElementById('tv_power_on').addEventListener('click', async (e) => {
            e.preventDefault();
            await sendCommand({
                type: 'send-cec',
                data: encodeURI('on 0'),
            });
        });
        document.getElementById('tv_volume_down').addEventListener('click', async (e) => {
            e.preventDefault();
            await sendCommand({
                type: 'send-cec',
                data: encodeURI('voldown'),
            });
        });
        document.getElementById('tv_volume_up').addEventListener('click', async (e) => {
            e.preventDefault();
            await sendCommand({
                type: 'send-cec',
                data: encodeURI('volup'),
            });
        });
        document.getElementById('tv_as').addEventListener('click', async (e) => {
            e.preventDefault();
            await sendCommand({
                type: 'send-cec',
                data: encodeURI('as'),
            });
        });
        document.getElementById('tv_is').addEventListener('click', async (e) => {
            e.preventDefault();
            await sendCommand({
                type: 'send-cec',
                data: encodeURI('is'),
            });
        });
        document.getElementById('send_bytes').addEventListener('change', async function(e) {
            e.preventDefault();
            await sendCommand({
                type: 'send-cec',
                data: encodeURI(`${this.value}`),
            });
            this.value = '';
        });
    })();
    
    // Available sources array.
    let availableSources = [];

    async function sendCommand(command = {}) {
        if (!command.type) return null;
        
        const searchParams = new URLSearchParams(command).toString();
        const url = new URLPattern(window.location.href);

        const urlString = `${url.protocol}://${url.hostname}:${url.port}/api/v1/command?${searchParams}`;
        console.log(urlString)

        let data = null;
        try {
            const res = await fetch(urlString, {
                method: 'GET',
            });

            if (!res.ok) throw new Error(await res.json());
            data = await res.json();

        } catch (e) {
            console.error(e);
        }
        return data;
    }
    async function refreshSources() {
        const response = await sendCommand({ type: 'get-sources' });

</script>

</html>
