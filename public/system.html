<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#000000">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NDPi Monitor Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        input[type="file"]::file-selector-button {
            display: none;
        }
        html,
        body {
            width: 100vw;
            height: 100vh;
            background: rgba(30, 30, 30, 1);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            color: #fff;
        }
        h2 {
            font-weight: 600;
            color: #eee;
            font-size: 18px;
            margin-top: 6px;
            margin-block-end: 8px;
        }
        label {
            font-weight: 400;
            color: #eee;
            font-size: 16px;
            text-wrap-mode: nowrap;
        }
        select,
        input {
            font-family: 'Courier New', Courier, monospace;
            font-weight: 600;
            width: 100%;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #eee;
            font-size: 16px;
            letter-spacing: 0.5px;
            box-sizing: border-box;
            outline: none;
            text-decoration: none;
            max-height: 40px;
        }
        select:disabled,
        input:disabled {
            border-color: #777;
            background: transparent;
            color: #999;
            text-shadow: none;
            cursor: not-allowed;

        }
        button {
            background: rgba(129, 193, 39, 1);
            border-color: rgb(112, 177, 20);
            border-width: 1px 2px 1px 2px;
            /* border: none; */
            border-radius: 10px;
            color: white;
            text-shadow: 1px 1px 3px #000;
            padding: 0 24px;
            min-height: 42px;
            font-size: 16px;
            cursor: pointer;
            user-select: none;
            /* min-width: 200px; */
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            align-items: center;
            text-wrap-mode: nowrap;
        }
        button:hover {
            background: rgb(103, 167, 14);
            border-color: rgba(129, 193, 39, 1);
            box-shadow: 0px 0px 5px rgba(200, 200, 200, 0.2);
        }
        button:disabled {
            border-color: #777;
            background: #555;
            color: #999;
            text-shadow: none;
            cursor: not-allowed;
        }
        .main {
            display: grid;
            margin: 10px;
        }
        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .flex-column {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 10px;
            width: 100%;
            align-items: center;
        }
        .flex-row {
            display: flex;
            flex-direction: row;
            gap: 10px;
            margin-bottom: 10px;
            width: 100%;
            justify-content: center;
            align-items: center;
        }
        .red {
            min-width: 0;
            background: rgba(220, 80, 80, 0.8);
            color: #fff;
            border-color: rgba(220, 80, 80, 1);
        }
        .red:hover {
            background: rgba(220, 80, 80, 1);
            border-color: rgba(240, 50, 50, 1);
            box-shadow: 0px 0px 5px rgba(200, 200, 200, 0.2);
        }
        .settings-table {
            border-spacing: 10px;
        }
        #overlay_preview img {
            max-height: 108px;
            max-width: 192px;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="card">
            <h2>Connected TV Controls</h2>
            <div class="flex-row">
                <div class="flex-column">
                    <button id="tv_power_on">ON
                        <svg xmlns="http://www.w3.org/2000/svg" height="30" fill="currentColor" style="stroke-width: 0.75px; stroke: rgba(20, 100, 20, 1); paint-order: stroke; stroke-linejoin: round;" viewBox="0 0 16 16">
                            <path d="M7.5 1v7h1V1z"/>
                            <path d="M3 8.812a5 5 0 0 1 2.578-4.375l-.485-.874A6 6 0 1 0 11 3.616l-.501.865A5 5 0 1 1 3 8.812"/>
                        </svg>
                    </button>
                    <button class="red" id="tv_power_off">OFF
                        <svg xmlns="http://www.w3.org/2000/svg" height="30" fill="currentColor" style="stroke-width: 0.75px; stroke: rgba(20, 20, 20, 0.7); paint-order: stroke; stroke-linejoin: round;" viewBox="0 0 16 16">
                            <path d="M7.5 1v7h1V1z"/>
                            <path d="M3 8.812a5 5 0 0 1 2.578-4.375l-.485-.874A6 6 0 1 0 11 3.616l-.501.865A5 5 0 1 1 3 8.812"/>
                        </svg>
                    </button>
                </div>
                <div class="flex-column">
                    <button id="tv_as">NDPi Monitor</button>
                    <button class="red" id="tv_is">Home</button>
                </div>
                <div class="flex-column">
                    <button id="tv_volume_up">
                        <svg xmlns="http://www.w3.org/2000/svg" height="30" fill="currentColor" style="stroke-width: 0.75px; stroke: rgba(20, 100, 20, 1); paint-order: stroke; stroke-linejoin: round;" viewBox="0 0 16 16">
                            <path d="M11.536 14.01A8.47 8.47 0 0 0 14.026 8a8.47 8.47 0 0 0-2.49-6.01l-.708.707A7.48 7.48 0 0 1 13.025 8c0 2.071-.84 3.946-2.197 5.303z"/>
                            <path d="M10.121 12.596A6.48 6.48 0 0 0 12.025 8a6.48 6.48 0 0 0-1.904-4.596l-.707.707A5.48 5.48 0 0 1 11.025 8a5.48 5.48 0 0 1-1.61 3.89z"/>
                            <path d="M8.707 11.182A4.5 4.5 0 0 0 10.025 8a4.5 4.5 0 0 0-1.318-3.182L8 5.525A3.5 3.5 0 0 1 9.025 8 3.5 3.5 0 0 1 8 10.475zM6.717 3.55A.5.5 0 0 1 7 4v8a.5.5 0 0 1-.812.39L3.825 10.5H1.5A.5.5 0 0 1 1 10V6a.5.5 0 0 1 .5-.5h2.325l2.363-1.89a.5.5 0 0 1 .529-.06"/>
                        </svg>
                    </button>
                    <button id="tv_volume_down">
                        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" style="stroke-width: 0.75px; stroke: rgba(20, 100, 20, 1); paint-order: stroke; stroke-linejoin: round;" viewBox="0 0 16 16">
                            <path d="M9 4a.5.5 0 0 0-.812-.39L5.825 5.5H3.5A.5.5 0 0 0 3 6v4a.5.5 0 0 0 .5.5h2.325l2.363 1.89A.5.5 0 0 0 9 12zm3.025 4a4.5 4.5 0 0 1-1.318 3.182L10 10.475A3.5 3.5 0 0 0 11.025 8 3.5 3.5 0 0 0 10 5.525l.707-.707A4.5 4.5 0 0 1 12.025 8"/>
                        </svg>
                    </button>
                </div>
            </div>
            <label>Custom CEC Command</label>
            <input type="text" value="" id="send_bytes">
        </div>
        <div class="card">
            <h2>NDI Source</h2>
            <div class="flex-row">
                <button style="min-width: 0;" id="refresh_sources">Refresh</button>
                <select id="source_selection">
                    <option value="none">None</option>
                </select>
            </div>
        </div>
        <div class="card">
            <h2>Overlay Image</h2>
            <div class="flex-row">
                <div id="overlay_preview"></div>
            </div>
            <div class="flex-row">
                <input id="overlay_upload" type="file" accept=".jpg, .png, .svg"/>
                <button id="save_overlay" disabled>Set Overlay</button>
                <button class="red" id="reset_overlay_upload">Reset</button>
            </div>
        </div>
        <div class="card">
            <h2>System Settings</h2>
            <table class="settings-table" id="settings"></table>
        </div>
    </div>
</body>

<script src="/system.js"></script>
<script>
    (async () => {
        await refreshSources();
        addEvents();
    })();

    // Available sources array.
    let availableSources = [];
    const uploaderEl = document.getElementById('overlay_upload');
    const uploaderPreviewEl = document.getElementById('overlay_preview');
    let overlayUploadCommand = {
        type: 'set-overlay',
        data: {
            name: '',
            type: '',
            size: 0,
            dateLastModified: '',
            dateUploaded: '',
            src: '',
        }
    };

    function addEvents() {
        document.getElementById('tv_power_off').addEventListener('click', async (e) => {
            e.preventDefault();
            await sendCommand({
                type: 'send-cec',
                data: 'standby%200',
            });
        });
        document.getElementById('tv_power_on').addEventListener('click', async (e) => {
            e.preventDefault();
            await sendCommand({
                type: 'send-cec',
                data: encodeURI('on 0'),
            });
        });
        document.getElementById('tv_volume_down').addEventListener('click', async (e) => {
            e.preventDefault();
            await sendCommand({
                type: 'send-cec',
                data: encodeURI('voldown'),
            });
        });
        document.getElementById('tv_volume_up').addEventListener('click', async (e) => {
            e.preventDefault();
            await sendCommand({
                type: 'send-cec',
                data: encodeURI('volup'),
            });
        });
        document.getElementById('tv_as').addEventListener('click', async (e) => {
            e.preventDefault();
            await sendCommand({
                type: 'send-cec',
                data: encodeURI('as'),
            });
        });
        document.getElementById('tv_is').addEventListener('click', async (e) => {
            e.preventDefault();
            await sendCommand({
                type: 'send-cec',
                data: encodeURI('is'),
            });
        });
        document.getElementById('send_bytes').addEventListener('change', async function(e) {
            e.preventDefault();
            this.disabled = true;
            await sendCommand({
                type: 'send-cec',
                data: encodeURI(`${this.value}`),
            });
            this.value = '';
            this.disabled = false;
        });
        document.getElementById('source_selection').addEventListener('change', async function(e) {
            e.preventDefault();
            this.disabled = true;
            await sendCommand({
                type: 'set-source',
                data: this.value,
            });
            this.disabled = false;
        });
        document.getElementById('refresh_sources').addEventListener('click', async function(e) {
            e.preventDefault();
            this.disabled = true;
            await refreshSources();
            this.disabled = false;
        });
        uploaderEl.addEventListener('change', handleFiles);
        document.getElementById('reset_overlay_upload').addEventListener('click', (e) => {
            e.preventDefault();
            resetOverlayUpload();
        });
        document.getElementById('save_overlay').addEventListener('click', async function(e) {
            e.preventDefault();
            this.disabled = true;
            const res = await sendCommand(overlayUploadCommand);
            if (res?.success)
            { resetOverlayUpload(); }
            else
            { console.error('Failed to upload overlay.', res) }
        });
        
    }

    function resetOverlayUpload() {
        document.getElementById('save_overlay').disabled = true;
        uploaderEl.value = '';
        uploaderPreviewEl.innerHTML = '';
        overlayUploadCommand = {
            type: 'set-overlay',
            data: {
                name: '',
                type: '',
                size: 0,
                dateLastModified: '',
                dateUploaded: '',
                src: '',
            }
        };
    }

    async function handleFiles() {
        uploaderEl.scroll({behavior: 'smooth'});
        const file = uploaderEl.files[0];

        if (!file.type.startsWith("image/"))
        { return; }

        const img = document.createElement("img");
        img.file = file;
        uploaderPreviewEl.appendChild(img);

        overlayUploadCommand.data.name = file.name || '';
        overlayUploadCommand.data.type = file.type || '';
        overlayUploadCommand.data.size = file.size || 0;
        overlayUploadCommand.data.dateLastModified = file.lastModified;
        overlayUploadCommand.data.dateUploaded = Date.now();


        const reader = new FileReader();
        reader.onload = (e) => {
            img.src = e.target.result;
            overlayUploadCommand.data.src = e.target.result;
            if (overlayUploadCommand.data.src)
            { document.getElementById('save_overlay').disabled = false; }
        };
        reader.readAsDataURL(file);
    }

    async function sendCommand(command = {}) {
        if (!command.type) return null;
        
        if (server?._ws && server?._ws.readyState === WebSocket.OPEN) 
        {
            try
            {
                server._ws.send(JSON.stringify(command));
                return;
            }
            catch (err)
            { console.error(err); }
        }
        
        // const searchParams = new URLSearchParams(command).toString();
        // const url = new URLPattern(window.location.href);
        // const urlString = `${url.protocol}://${url.hostname}:${url.port}/api/v1/command?${searchParams}`;

        const url = new URLPattern(window.location.href);
        const urlString = `${url.protocol}://${url.hostname}:${url.port}/api/v1/command`;

        let data = null;
        try
        {
            const res = await fetch(urlString, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(command)
            });
            if (!res.ok) throw new Error(await res.json());
            data = await res.json();
        }
        catch (e) 
        { console.error(e); }
        return data;
    }
   
    async function refreshSources() {
        const response = await sendCommand({ type: 'get-sources' });
        console.log(response);
        if (response.success)
        { availableSources = response.data.sources || []; }
        renderSources();
    }
    
    function renderSources() {
        const sourceSelectorEl = document.getElementById('source_selection');
        if (!sourceSelectorEl)
        { return; }

        sourceSelectorEl.innerHTML = '';

        const noSourceOpt = document.createElement('option');
        noSourceOpt.value = 'none';
        noSourceOpt.textContent = 'Clear Source';
        sourceSelectorEl.appendChild(noSourceOpt);

        if (availableSources.length >= 1)
        {
            availableSources.forEach((source) => {
                if (!source.name)
                { return; }

                const sourceOpt = document.createElement('option');
                sourceOpt.value = source.name;
                sourceOpt.dataset.url = source.url || '';
                sourceOpt.textContent = source.name;
                sourceSelectorEl.appendChild(sourceOpt);
            });
        }
        const currentSourceEl = document.getElementById('ndpi_status_ndi_source_target');

        if (currentSourceEl)
        { sourceSelectorEl.value = currentSourceEl.value || 'none'; }
    }
</script>

</html>
