<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#000000">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NDPi Monitor Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 1);
            overflow: hidden;
            cursor: none;
        }
        #display-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #overlay-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #overlay-svg {
            opacity: 0;
            width: auto;
            height: 50vh;
            object-fit: contain;
            transition: opacity 800ms ease;
        }
        #waiting-for-server-svg {
            position: absolute;
            left: 0;
            top: 0;
            margin: 1vh;
            width: 8vh;
            transition: opacity 300ms ease;
        }
        #attempting-ndi-connection-svg {
            position: absolute;
            right: 0;
            top: 0;
            margin: 1vh;
            width: 6vh;
            transition: opacity 300ms ease;
        }
        .status-indicator {
            position: absolute;
            width: 100vw;
            height: 10vh;
            top: 0;
            display: flex;
            align-items: flex-start;
            justify-content: flex-end;
        }
        #sys-details {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: start;
            margin: 0.3vh;
            color: rgb(35,35,35);
            font-family: monospace;
            font-size: 1.1vh;
            opacity: 0;
            transition: opacity 800ms ease;
        }
    </style>
    <style>
        .spinner_V8m1 {
            transform-origin: center;
            animation: spinner_zKoa 2s linear infinite
        }
        .spinner_V8m1 circle {
            stroke-linecap: round;
            animation: spinner_YpZS 1.5s ease-in-out infinite
        }
        @keyframes spinner_zKoa {
            100% {
                transform: rotate(360deg)
            }
        }
        @keyframes spinner_YpZS {
            0% {
                stroke-dasharray: 0 150;
                stroke-dashoffset: 0
            }
            47.5% {
                stroke-dasharray: 42 150;
                stroke-dashoffset: -16
            }
            95%,
            100% {
                stroke-dasharray: 42 150;
                stroke-dashoffset: -59
            }
        }
    </style>
</head>

<body>
    <!-- SYSTEM DETAILS -->
    <div id="sys-details">
        <div>
            <span id="devName" style="font-weight: 600; font-size: 110%"></span>
            <br>
            <span id="devId" style="text-transform: uppercase; font-size:90%; letter-spacing: 0.07vh;"></span>
        </div>
        <div>IP:<span id="devIp" style="font-weight: 600"></span></div>
        <div>SERVER:<span id="servIp" style="font-weight: 600"></span></div>

        <div style="font-size: 90%; display: flex;">
            <span id="programName"></span>
            <div>&nbsp;|&nbsp;v<span id="programVer"></span></div>
        </div>
    </div>
    <!-- WAITING FOR SERVER CONNECTION -->
    <div id="waiting-for-server-svg" style="opacity: 1;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
            <circle fill="none" stroke-opacity="1" stroke="#81C127" stroke-width=".5" cx="100" cy="100" r="0">
                <animate attributeName="r" calcMode="spline" dur="1.5" values="1;80" keyTimes="0;1"
                    keySplines="0 .2 .5 1" repeatCount="indefinite"></animate>
                <animate attributeName="stroke-width" calcMode="spline" dur="1.5" values="0;25" keyTimes="0;1"
                    keySplines="0 .2 .5 1" repeatCount="indefinite"></animate>
                <animate attributeName="stroke-opacity" calcMode="spline" dur="1.5" values="1;0" keyTimes="0;1"
                    keySplines="0 .2 .5 1" repeatCount="indefinite"></animate>
            </circle>
        </svg>
    </div>
    <!-- CONNECTING TO SOURCE -->
    <div id="attempting-ndi-connection-svg" style="opacity: 0;">
        <svg stroke="#81c127" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <g class="spinner_V8m1">
                <circle cx="12" cy="12" r="9.5" fill="none" stroke-width="2.5"></circle>
            </g>
        </svg>
    </div>
    <!-- OVERLAY CONTAINER -->
    <div id="display-container">
        <div id="overlay-container">
            <img id="overlay-svg" src="" alt="NDPi Monitor">
        </div>
    </div>

    <script>

        (() => {
            console.error('nope', navigator);
        })();

        const waitingForServer   = (show = true) => { document.getElementById('waiting-for-server-svg').style.opacity = show ? 1 : 0; }
        const connectingToSource = (show = true) => { document.getElementById('attempting-ndi-connection-svg').style.opacity = show ? 1 : 0; }
        const displayDetails     = (show = true) => { document.getElementById('sys-details').style.opacity = show ? 1 : 0; }
        
        const displayOverlay = async (show = true, imagePath = '') => {
            const svgContainer = document.getElementById('overlay-svg');
            let overlayImageSrc = imagePath || null;
            if (show && overlayImageSrc) 
            {
                svgContainer.style.opacity = 0; 
                await new Promise((resolve) => {
                    setTimeout(() => {
                        svgContainer.src = overlayImageSrc;
                        setTimeout(() => { resolve(); }, 200);
                    }, 810);
                });
                svgContainer.style.opacity = 1;
            }
            else if (show) 
            {
                svgContainer.src = '/assets/Display_Overlay.svg';
                await new Promise((resolve) => {
                    setTimeout(() => { resolve(); }, 200);
                });
                svgContainer.style.opacity = 1
            } else
            {
                svgContainer.style.opacity = 0;
            }
        }

        const hideAll = () => {
            displayDetails(false);
            displayOverlay(false);
            connectingToSource(false);
        }


        class DeviceSocket {
            constructor() {
                
                this._ws = null;

                this.protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                this.host = window.location.host;

                this.timerNdpiHubServerPing = null;
                this.timerReconnectDevice = null;
                this.timerPageReload = null;

                this.connect();
            }

            disconnect() {
                if (this._ws && this._ws.readyState === WebSocket.OPEN)
                try { this._ws.close(); } catch {}
                this._ws = null;
            }

            connect() {
                if (this._ws && this._ws.readyState === WebSocket.OPEN)
                try { this._ws.close(); } catch {}
                this._ws = null;

                this._ws = new WebSocket(`${this.protocol}//${this.host}`);

                this._ws.onopen = () => {
                    console.log('Connected to device server');
                    if (this.timerPageReload) 
                    { clearTimeout(this.timerPageReload); this.timerPageReload = null; }
                    if (this.timerReconnectDevice)
                    { clearInterval(this.timerReconnectDevice); this.timerReconnectDevice = null; }
                };

                this._ws.onmessage = (message) => {
                    try
                    {
                        const msg = JSON.parse(message.data);
                        handleDisplayCommand(msg);
                    }
                    catch (e)
                    { console.error('Invalid message:', e); }
                };

                this._ws.onerror = (error) => {
                    console.error('WebSocket error:', error);
                };

                this._ws.onclose = () => {
                    this.scheduleDeviceReconnect();
                    this._ws = null;
                }
            }

            scheduleDeviceReconnect(ms = 10000, timeout = 120000) {
                if (this.timerReconnectDevice) 
                { clearInterval(this.timerReconnectDevice); this.timerReconnectDevice = null; }
                this.timerReconnectDevice = setInterval(() => { this.connect(); }, ms);

                if (this.timerPageReload) 
                { return; }
                this.timerPageReload = setTimeout(() => { window.navigation.reload(); }, timeout);
            }

            // call this when the NDPi Hub Server establishes a connection with the client device.
            hubConnected(timeout = 10000) {
                waitingForServer(false);
                if (this.timerNdpiHubServerPing)
                {
                    clearTimeout(this.timerNdpiHubServerPing);
                    this.timerNdpiHubServerPing = null;
                }
                this.timerNdpiHubServerPing = setTimeout(() => { waitingForServer(true); }, timeout);
            }
            
        }

        const server = new DeviceSocket();

        function handleDisplayCommand(msg) {
            switch (msg.type) {
                case 'update-details':
                    updateDetails(msg);
                    break;
                case 'ndpi-server-connected':
                    server.hubConnected(10000);
                    break;
                case 'ndi-init':
                    connectingToSource(true);
                    break;
                case 'ndi-started':
                    hideAll();
                    break;
                case 'show-ndi':
                    hideAll();
                    break;
                case 'show-overlay':
                    displayOverlay(true);
                    updateDetails(msg);
                    break;
                case 'show-blank':
                    displayOverlay(false);
                    updateDetails(msg);
                    break;
                case 'show-custom-overlay':
                    displayOverlay(true, msg.data);
                    break;
                default:
                    console.log("Message Received from device with unrecognized type.", msg);
                    break;
            }
        }

        function updateDetails(msg) {
            const fields = {
                devName:     msg.thisDevice?.name,
                devId:       msg.thisDevice?.id,
                devIp:       msg.thisDevice?.address === undefined ? undefined
                             : msg.thisDevice.address === 'localhost' ? 'Obtaining...'
                             : msg.thisDevice.address,
                servIp:      msg.serverIp || '-.-.-.-',
                programName: msg.service?.name,
                programVer:  msg.service?.version,
            };

            for (const [id, value] of Object.entries(fields)) {
                if (value === undefined) continue;
                document.getElementById(id).textContent = value;
            }
            displayDetails();
        }
    </script>
</body>

</html>
