<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#000000">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NDPi Monitor Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html::-webkit-scrollbar {
            display:none;
        }
        html,
        body {
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 1);
            overflow: hidden;
            cursor: none;
        }
        #display-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #overlay-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 800ms ease;
        }
        #overlay {
            opacity: 0;
            width: auto;
            height: 65vh;
            object-fit: contain;
            transition: opacity 800ms ease;
        }
        #waiting-for-hub-svg {
            position: absolute;
            left: 0;
            top: 0;
            margin: 1vh;
            width: 8vh;
            transition: opacity 500ms ease;
        }
        #attempting-ndi-connection-svg {
            position: absolute;
            right: 0;
            top: 0;
            margin: 1vh;
            width: 6vh;
            transition: opacity 500ms ease;
        }
        .status-indicator {
            position: absolute;
            width: 100vw;
            height: 10vh;
            top: 0;
            display: flex;
            align-items: flex-start;
            justify-content: flex-end;
        }
        #sys-details {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: start;
            margin: 0.3vh;
            color: rgb(35,35,35);
            font-family: monospace;
            font-size: 1.1vh;
            opacity: 0;
            transition: opacity 800ms ease;
        }
    </style>
    <style>
        .spinner_V8m1 {
            transform-origin: center;
            animation: spinner_zKoa 2s linear infinite
        }
        .spinner_V8m1 circle {
            stroke-linecap: round;
            animation: spinner_YpZS 1.5s ease-in-out infinite
        }
        @keyframes spinner_zKoa {
            100% {
                transform: rotate(360deg)
            }
        }
        @keyframes spinner_YpZS {
            0% {
                stroke-dasharray: 0 150;
                stroke-dashoffset: 0
            }
            47.5% {
                stroke-dasharray: 42 150;
                stroke-dashoffset: -16
            }
            95%,
            100% {
                stroke-dasharray: 42 150;
                stroke-dashoffset: -59
            }
        }
    </style>
</head>

<body>
    <!-- SYSTEM DETAILS -->
    <div id="sys-details">
        <div>
            <span id="device_name" style="font-weight: 600; font-size: 110%"></span>
            <br>
            <span id="device_id" style="text-transform: uppercase; font-size:90%; letter-spacing: 0.07vh;"></span>
        </div>
        <div>IP:<span id="device_ip" style="font-weight: 600"></span></div>
        <div id="div__ndpi_hub_hostname">HUB:<span id="ndpi_hub_hostname" style="font-weight: 600"></span></div>

        <div style="font-size: 90%; display: flex;">
            <span id="device_type"></span>
            <div>&nbsp;|&nbsp;v<span id="ndpi_version"></span></div>
        </div>
    </div>
    <!-- WAITING FOR HUB CONNECTION -->
    <div id="waiting-for-hub-svg" style="opacity: 1;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
            <circle fill="none" stroke-opacity="1" stroke="#81C127" stroke-width=".5" cx="100" cy="100" r="0">
                <animate attributeName="r" calcMode="spline" dur="1.5" values="1;80" keyTimes="0;1"
                    keySplines="0 .2 .5 1" repeatCount="indefinite"></animate>
                <animate attributeName="stroke-width" calcMode="spline" dur="1.5" values="0;25" keyTimes="0;1"
                    keySplines="0 .2 .5 1" repeatCount="indefinite"></animate>
                <animate attributeName="stroke-opacity" calcMode="spline" dur="1.5" values="1;0" keyTimes="0;1"
                    keySplines="0 .2 .5 1" repeatCount="indefinite"></animate>
            </circle>
        </svg>
    </div>
    <!-- CONNECTING TO SOURCE -->
    <div id="attempting-ndi-connection-svg" style="opacity: 0;">
        <svg stroke="#81c127" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <g class="spinner_V8m1">
                <circle cx="12" cy="12" r="9.5" fill="none" stroke-width="2.5"></circle>
            </g>
        </svg>
    </div>
    <!-- OVERLAY CONTAINER -->
    <div id="display-container">
        <div id="overlay-container">
            <img id="overlay" src="" alt="NDPi Monitor">
        </div>
    </div>

    <script src="/socket.js"></script>
    <script src="/index.js"></script>
</body>

</html>
